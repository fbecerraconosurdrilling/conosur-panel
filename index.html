<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo · CONOSUR Drilling</title>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #2a3449;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --blue: #58a6ff;
      --green: #3fb950;
      --red: #f85149;
      --amber: #d29922;
    }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 30px;
    }
    
    .container { max-width: 1400px; margin: 0 auto; }
    
    .header-info { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 20px; }
    .header-info h1 { margin: 0; font-size: 24px; font-weight: 600; color: var(--blue); letter-spacing: 0.5px; }
    .header-info span { color: var(--text-muted); font-size: 12px; font-family: monospace; }
    
    .filters-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; background: var(--surface); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
    .filter-group select, .filter-group input { background: var(--bg); border: 1px solid var(--border); color: white; padding: 8px 12px; border-radius: 6px; font-size: 13px; outline: none; }
    .filter-group select:focus, .filter-group input:focus { border-color: var(--blue); }
    
    .grid-proyectos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .proj-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .proj-card .pc-header {
      background: #1f242c;
      text-align: center;
      padding: 12px;
      font-weight: bold;
      font-size: 16px;
      text-transform: uppercase;
      border-bottom: 1px solid var(--border);
      color: var(--blue);
    }
    .proj-card .pc-row {
      padding: 10px 15px;
      border-bottom: 1px dashed var(--border);
      display: flex;
      justify-content: space-between;
      font-size: 13px;
    }
    .proj-card .pc-row:last-child { border-bottom: none; }
    .proj-card .pc-cams { padding: 10px 15px; }
    .proj-card .pc-cams .pc-cam-item { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 13px; }
    .proj-card .pc-cams .pc-cam-item:last-child { margin-bottom: 0; }
    
    .c-ok { color: var(--green); font-weight: bold; }
    .c-fail { color: var(--red); font-weight: bold; }
    .c-warn { color: var(--amber); font-weight: bold; }
    .c-mut { color: var(--text-muted); }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-info">
      <h1>📡 Monitoreo de Proyectos</h1>
      <span id="last-update">Cargando datos...</span>
    </div>

    <div class="filters-bar">
      <div class="filter-group">
        <label>Buscar (Proyecto o Cámara)</label>
        <input type="text" id="filtro-nombre" onkeyup="renderizarTarjetas()" placeholder="Ej: MARIANA o HY06...">
      </div>
      <div class="filter-group">
        <label>Sede</label>
        <select id="filtro-sede" onchange="renderizarTarjetas()">
          <option value="">Todas</option>
          <option value="NOA">NOA</option>
          <option value="MENDOZA">MENDOZA</option>
          <option value="SAN JUAN">SAN JUAN</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Estado Proyecto</label>
        <select id="filtro-estado-proy" onchange="renderizarTarjetas()">
          <option value="">Todos</option>
          <option value="Activo">Activo</option>
          <option value="Inactivo">Inactivo</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Estado Antena</label>
        <select id="filtro-estado-ant" onchange="renderizarTarjetas()">
          <option value="">Todas</option>
          <option value="OK">OK</option>
          <option value="FAIL">FALLÓ</option>
        </select>
      </div>
    </div>

    <div class="grid-proyectos" id="grid-proyectos">
      <p style="color: var(--text-muted); grid-column: 1 / -1;">Cargando datos de proyectos...</p>
    </div>
  </div>

  <script>
    let proyectosList = [];

    async function cargarDatos() {
      try {
        // ACÁ LEE EL ARCHIVO CORRECTO
        const res = await fetch("datos.json");
        if (!res.ok) throw new Error("No se encontró datos.json");
        
        const data = await res.json();
        proyectosList = data.proyectos || [];
        
        if (data.timestamp) {
          document.getElementById('last-update').innerText = `Última actualización: ${new Date(data.timestamp).toLocaleString()}`;
        }
        
        renderizarTarjetas();
      } catch (e) {
        document.getElementById('grid-proyectos').innerHTML = `<p style="color: var(--red); grid-column: 1 / -1;">Error al cargar datos: ${e.message}</p>`;
      }
    }

    function renderizarTarjetas() {
      const grid = document.getElementById('grid-proyectos');
      
      const fNombre = document.getElementById('filtro-nombre').value.toLowerCase();
      const fSede = document.getElementById('filtro-sede').value;
      const fEstadoProy = document.getElementById('filtro-estado-proy').value;
      const fEstadoAnt = document.getElementById('filtro-estado-ant').value;

      let filtrados = proyectosList.filter(p => {
        const matchNombreProy = p.nombre.toLowerCase().includes(fNombre);
        const matchNombreCam = p.camaras.some(c => (c.name || "").toLowerCase().includes(fNombre) || (c.tipo || "").toLowerCase().includes(fNombre));
        const matchNombre = matchNombreProy || matchNombreCam;

        const matchSede = fSede === "" || p.sede === fSede;
        const matchProy = fEstadoProy === "" || p.estado_proyecto === fEstadoProy;
        const matchAnt = fEstadoAnt === "" || (p.antena && p.antena.estado === fEstadoAnt);
        
        return matchNombre && matchSede && matchProy && matchAnt;
      });

      if(filtrados.length === 0) { 
        grid.innerHTML = '<p style="color:var(--text-muted); grid-column: 1 / -1;">No hay proyectos que coincidan con los filtros.</p>'; 
        return; 
      }

      grid.innerHTML = filtrados.map(p => {
        const antOk = p.antena && p.antena.estado === 'OK';
        
        const camsHtml = p.camaras.map(c => `
          <div class="pc-cam-item">
            <span>${c.name || c.tipo}</span>
            <span class="${c.estado === 'OK' ? 'c-ok' : 'c-fail'}">${c.estado}</span>
          </div>
        `).join('') || '<div class="pc-cam-item"><span class="c-mut">Sin cámaras</span></div>';

        return `
          <div class="proj-card">
            <div class="pc-header">${p.nombre}</div>
            <div class="pc-row">
              <span>SEDE: <strong>${p.sede}</strong></span>
              <span>ESTADO: <strong class="${p.estado_proyecto === 'Activo' ? 'c-ok' : 'c-warn'}">${p.estado_proyecto}</strong></span>
            </div>
            <div class="pc-row">
              <span>ANTENA: <strong>${p.antena.nombre}</strong></span>
            </div>
            <div class="pc-row">
              <span>EST. ANTENA:</span>
              <span class="${antOk ? 'c-ok' : 'c-fail'}">${p.antena.estado}</span>
            </div>
            <div class="pc-cams">
              <div class="pc-row" style="padding:0; border:none; margin-bottom:5px; color:var(--text-muted); font-weight:bold;">CÁMARAS:</div>
              ${camsHtml}
            </div>
          </div>
        `;
      }).join('');
    }

    cargarDatos();
    setInterval(cargarDatos, 5 * 60 * 1000);
  </script>
</body>
</html>
