<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CONOSUR Drilling · Panel de Proyectos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bg: #0d1117; --surface: #161b22; --border: #232a33; --text: #e6edf3; --green: #3fb950; --red: #f85149; --blue: #2e7be0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; }
    .project-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-top: 4px solid var(--blue); }
    .project-title { font-size: 1.4rem; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
    .section-title { font-size: 0.85rem; color: #8b949e; text-transform: uppercase; margin-bottom: 8px; font-weight: 600; }
    .status-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; font-family: monospace; font-size: 1.1rem; }
    .status-ok { color: var(--green); font-weight: bold; }
    .status-fail { color: var(--red); font-weight: bold; }
    .footer-data { margin-top: 15px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 0.85rem; color: #8b949e; font-family: monospace; text-align: right; }
    .search-bar { margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); color: white; }
  </style>
</head>
<body>
  <div class="container">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2>Monitoreo de Proyectos</h2>
      <span class="text-muted" id="last-update">Cargando...</span>
    </div>
    <input type="text" id="search" class="form-control search-bar" placeholder="Buscar proyecto...">
    <div id="projects-container" class="row"></div>
  </div>

  <script>
    const esLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const DATA_URL = esLocal ? '/api/proyectos' : 'datos.json'; 

    let allProjects = [];

    async function loadData() {
      try {
        const res = await fetch(DATA_URL);
        if (!res.ok) throw new Error("Error HTTP " + res.status);
        const data = await res.json();
        
        allProjects = Array.isArray(data) ? data : (data.proyectos || []);
        const timeStr = data.timestamp ? new Date(data.timestamp).toLocaleString() : new Date().toLocaleString();
        document.getElementById('last-update').innerText = `Actualizado: ${timeStr}`;
        render();
      } catch (e) {
        document.getElementById('projects-container').innerHTML = `<p class="text-danger">Error al cargar datos: ${e.message}</p>`;
      }
    }

    function render() {
      const q = document.getElementById('search').value.toLowerCase();
      const container = document.getElementById('projects-container');
      const filtered = allProjects.filter(p => p.nombre.toLowerCase().includes(q));
      
      if (filtered.length === 0) {
        container.innerHTML = `<p class="text-muted">No se encontraron proyectos.</p>`;
        return;
      }

      container.innerHTML = filtered.map(p => {
        const antOk = p.antena && p.antena.estado === 'OK';
        const camsHtml = p.camaras.map(c => `
          <div class="status-row">
            <span>${c.tipo}</span>
            <span class="${c.estado === 'OK' ? 'status-ok' : 'status-fail'}">(${c.estado})</span>
          </div>
        `).join('') || '<span class="text-muted">Sin cámaras</span>';

        return `
          <div class="col-md-6 col-lg-4">
            <div class="project-card">
              <div class="project-title">${p.nombre}</div>
              <div class="mb-3">
                <div class="section-title">ESTADO DE ANTENA</div>
                <div class="status-row">
                  <span>FUNCIONAMIENTO</span>
                  <span class="${antOk ? 'status-ok' : 'status-fail'}">(${antOk ? 'OK' : 'FALLÓ'})</span>
                </div>
              </div>
              <div class="mb-3">
                <div class="section-title">CÁMARAS</div>
                ${camsHtml}
              </div>
              <div class="footer-data">
                DATOS: ${p.antena ? p.antena.ultima_lectura : '—'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    document.getElementById('search').addEventListener('input', render);
    loadData();
    setInterval(loadData, 5 * 60 * 1000);
  </script>
</body>
</html>
